
[workspace]
name = "lerobot_so101"
version = "0.1.0"
channels = [
    "https://prefix.dev/robostack-jazzy",
    "https://prefix.dev/conda-forge"
]
platforms = ["linux-64"]

[tasks]
pedido-modelos = "bash nodos_ros/binary_tree/scripts/prepare_models.sh"
pedido-microfonos = "bash nodos_ros/binary_tree/scripts/run_voice.sh --listar-microfonos"
pedido-build = { cmd = "colcon build --packages-select binary_tree --symlink-install --cmake-args -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python -DBUILD_TESTING=ON", cwd = "nodos_ros" }
pedido = { cmd = "bash nodos_ros/binary_tree/scripts/run_voice.sh", depends-on = ["pedido-build"] }
build = { cmd = "colcon build", cwd = "../hri_ros2" }
modelo = { cmd = "mkdir -p models && cd models && curl -fLO https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip && unzip -o vosk-model-small-es-0.42.zip && python -m piper.download_voices es_ES-davefx-medium", cwd = "../hri_ros2" }
hri = { cmd = "bash hri.sh voz", cwd = "../hri_ros2", depends-on = ["build"] }
probar = { cmd = "bash hri.sh teclado", cwd = "../hri_ros2", depends-on = ["build"] }
gui = { cmd = "bash nodos_ros/binary_tree/scripts/run_gui.sh", depends-on = ["pedido-build"] }
test = { cmd = "bash nodos_ros/binary_tree/scripts/run_gui.sh --test", depends-on = ["pedido-build"] }

[dependencies]
python = "3.12.*"
ffmpeg = ">=9.0.2,<10"
git = ">=2.55.0,<3"
git-lfs = ">=3.8.0,<4"
numpy = ">=2.0,<2.3"
ros-jazzy-desktop = ">=0.11.0,<0.12"
colcon-common-extensions = "*"
setuptools = ">=71,<82"
python-sounddevice = "*"
portaudio = "*"
curl = "*"
unzip = "*"
ros-jazzy-behaviortree-cpp = ">=4.9.1,<5"


[constraints]
setuptools = ">=71,<82"
packaging = ">=24.2,<26"
pillow = ">=10,<13"
opencv = ">=4.9,<4.14"
py-opencv = ">=4.9,<4.14"

[pypi-dependencies]
lerobot = { version = ">=0.6.1,<0.7", extras = ["core-scripts", "feetech", "training"] }
mujoco = ">=3.13.0,<4"
so101-nexus = ">=0.7.0,<0.8"
evdev = ">=2.0.0,<3"
opencv-python-headless = ">=4.9,<4.14"
PyQt6 = "*"
sounddevice = "*"
faster-whisper = "*"
vosk = "*"
piper-tts = "*"
pyttsx3 = ">=2.99,<3"
