
[workspace]
name = "lerobot_so101"
version = "0.1.0"
channels = [
    "https://prefix.dev/robostack-jazzy",
    "https://prefix.dev/conda-forge"
]
platforms = ["linux-64"]

[tasks]
mando = "python controlar_ps4.py"
mando-test = "python controlar_ps4.py --probar-mando"

[dependencies]
python = "3.12.*"
ffmpeg = ">=9.0.2,<10"
git = ">=2.55.0,<3"
git-lfs = ">=3.8.0,<4"
numpy = ">=2.0,<2.3"
ros-jazzy-desktop = ">=0.11.0,<0.12"


[constraints]
setuptools = ">=71,<82"
packaging = ">=24.2,<26"
pillow = ">=10,<13"
opencv = ">=4.9,<4.14"
py-opencv = ">=4.9,<4.14"

[pypi-dependencies]
lerobot = { version = ">=0.6.1,<0.7", extras = ["core-scripts", "feetech", "training"] }
mujoco = ">=3.13.0,<4"
so101-nexus = ">=0.7.0,<0.8"
evdev = ">=2.0.0,<3"
opencv-python-headless = ">=4.9,<4.14"
